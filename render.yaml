services:
  - type: web
    name: social-manager
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: SOCIAL_MANAGER_SECRET
        generateValue: true
      - key: SOCIAL_MANAGER_DB
        value: /data/social.db
      - key: SOCIAL_MANAGER_UPLOADS
        value: /data/uploads
    disk:
      name: social-manager-data
      mountPath: /data
      sizeGB: 1
